# =============================================================
# Deploy api/ to a standalone Azure Function App (Flex
# Consumption, Linux, Node 22). Authenticates via OIDC
# federated credentials — Flex Consumption has no Kudu/SCM
# endpoint, so publish-profile auth doesn't work.
#
# Required GitHub secrets:
#   AZURE_FUNCTIONAPP_NAME        Function App name, e.g.
#                                 mojong-signaling-api
#   AZURE_CLIENT_ID               App registration / SP client id
#   AZURE_TENANT_ID               Azure tenant id
#   AZURE_SUBSCRIPTION_ID         Subscription containing the
#                                 Function App
#
# Required one-time Azure setup (see SETUP.md or chat history):
#   1. Create an App Registration (or User-assigned Managed
#      Identity) and add a federated credential pointing at
#      this repo's main branch.
#   2. On the Function App's resource group (or the Function
#      App resource itself), grant the SP / UAMI the
#      "Contributor" role so it can deploy code.
# =============================================================

name: Deploy API to Azure Functions

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/azure-functions-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Storage account backing the Function App (Flex Consumption
# deployment container). The deploy step uploads the ZIP package
# to this account; if its publicNetworkAccess is Disabled, the
# GitHub-hosted runner cannot reach it and the deploy fails with
# a misleading "AzureWebJobsStorage missing" error. See
# ARCHITECTURE_CLARIFICATIONS.md D-010 for the full rationale.
env:
  STORAGE_ACCOUNT_NAME: mojongsignaling
  STORAGE_RESOURCE_GROUP: mojong

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build TypeScript
        working-directory: api
        run: npm run build

      - name: Run unit tests
        working-directory: api
        run: npm test

      - name: Prune to production dependencies
        working-directory: api
        run: npm prune --production

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure storage account allows public network access
        # Flex Consumption deploys upload the ZIP package to the
        # Function App's backing storage account. If
        # publicNetworkAccess is Disabled, the runner can't reach
        # it and the deploy fails with a misleading
        # "AzureWebJobsStorage missing" warning. Re-enable it
        # idempotently before every deploy.
        run: |
          current=$(az storage account show \
            --name "$STORAGE_ACCOUNT_NAME" \
            --resource-group "$STORAGE_RESOURCE_GROUP" \
            --query publicNetworkAccess -o tsv)
          echo "publicNetworkAccess is currently: $current"
          if [ "$current" != "Enabled" ]; then
            echo "Enabling publicNetworkAccess on $STORAGE_ACCOUNT_NAME..."
            az storage account update \
              --name "$STORAGE_ACCOUNT_NAME" \
              --resource-group "$STORAGE_RESOURCE_GROUP" \
              --public-network-access Enabled \
              --output none
          fi

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: api
